[project]
name = "zenark-backend-core"
version = "0.4.0"
description = "Shared Zenark platform package: config, Mongo, encryption, accounts, tenancy, and Bedrock."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "motor>=3.5.0",
  "pymongo>=4.8.0",
  "cryptography>=42.0.0",
  "langchain-core>=0.3.0",
  "langchain-aws>=0.2.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "mongomock-motor>=0.0.33",
]

[tool.setuptools]
py-modules = ["database", "llm_provider"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend_core*", "config*", "core*", "db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
